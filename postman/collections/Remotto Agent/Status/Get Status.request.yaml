$kind: http-request
name: Get Status
method: GET
url: "{{baseUrl}}/status"
description: "Membaca keadaan agent: nama, versi, uptime, volume, dan jadwal daya (pending). Dipakai polling dan tes koneksi. Idempoten. Volume bernilai null bila Core Audio gagal; respons tetap 200."
order: 1000
headers:
  Authorization: Bearer {{token}}
