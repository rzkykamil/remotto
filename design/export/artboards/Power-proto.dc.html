<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Remotto — Prototype daya</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF9A6A}a:hover{color:#FFB48E}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glEdge);box-shadow:inset 0 1px 0 var(--glHi),inset 0 -1px 0 var(--glLo),0 12px 32px var(--glShadow)}
.key{appearance:none;margin:0;padding:0 20px;font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--glEdge);box-shadow:inset 0 1px 0 var(--glHi);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:16px;font-weight:600;transition:transform 180ms cubic-bezier(.34,1.4,.64,1);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
.key:active{transform:scale(.96);transition-duration:90ms}
.key.glass{background:var(--gl)}
.key.strong{background:var(--fg);color:var(--bg);border-color:transparent}
.key.dangerOutline{background:transparent;color:var(--dangerText);border:1.5px solid var(--dangerText);box-shadow:none}
.key.acc{background:linear-gradient(180deg,#FF8A55,#F26A30);color:#1A0F08;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 10px 28px rgba(242,106,48,.3);padding:0}
.key.ghost{background:transparent;border-color:transparent;box-shadow:none;padding:0}
@media (prefers-reduced-motion: reduce){.key{transition:none}.key:active{transform:none}}
</style>
</helmet>
<div style="position: relative; width: 412px; height: 915px; overflow: hidden; font-family: Geist, system-ui, sans-serif; color: var(--fg); background-color: #110F0D; background-image: radial-gradient(90% 45% at 90% 18%, rgba(242,106,48,0.18), transparent 70%), radial-gradient(90% 40% at 8% 92%, rgba(170,80,30,0.20), transparent 70%); --bg: #110F0D; --fg: #F1EBE2; --fg2: #BDB3A6; --gl: rgba(255,255,255,0.07); --glEdge: rgba(255,255,255,0.14); --glHi: rgba(255,255,255,0.20); --glLo: rgba(0,0,0,0.35); --glShadow: rgba(0,0,0,0.45); --chip: rgba(255,255,255,0.10); --track: rgba(255,255,255,0.08); --danger: #FF6F5E; --onDanger: #1A0F08; --dangerText: #FF8A7C; --dangerSoft: rgba(255,111,94,0.10); --ok: #6FCB92">

<div style="position: absolute; inset: 0; padding: 52px 24px 36px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
<header style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<div style="font-size: 22px; line-height: 28px; font-weight: 600">Laptop-Kamil</div>
<div class="glass" role="status" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--fg2)"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--ok)"></span>NYAMBUNG · 3J 12M</div>
</div>
<button class="key glass" aria-label="Pengaturan" style="width: 48px; height: 48px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></button>
</header>
<section aria-label="Daya" style="display: flex; gap: 10px">
<button class="key glass" onClick="{{openSleep}}" style="flex: 1 1 0; min-width: 0; height: 52px; padding: 0 6px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>Sleep</button>
<button class="key glass" onClick="{{openRestart}}" style="flex: 1 1 0; min-width: 0; height: 52px; padding: 0 6px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
<button class="key glass" onClick="{{openOff}}" style="flex: 1 1 0; min-width: 0; height: 52px; padding: 0 6px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>Matikan</button>
</section>
<section class="glass" aria-label="Volume" style="flex: 1 1 auto; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--fg2)">VOLUME</span>
<div style="text-align: center; font-family: 'Geist Mono', monospace; font-size: 128px; line-height: 1; font-weight: 600; letter-spacing: -0.04em">35<span style="font-size: 0.32em; color: var(--fg2)">%</span></div>
<div style="height: 60px; border-radius: 999px; background: rgba(0,0,0,0.35); overflow: hidden"><div style="width: 35%; height: 100%; border-radius: 999px; background: #E2D9CC"></div></div>
</section>
<section class="glass" aria-label="Media" style="border-radius: 999px; padding: 8px; display: flex; align-items: center; justify-content: space-between">
<button class="key ghost" aria-label="Lagu sebelumnya" style="width: 80px; height: 80px"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
<button class="key acc" aria-label="Jeda" style="width: 96px; height: 96px"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg></button>
<button class="key ghost" aria-label="Lagu berikutnya" style="width: 80px; height: 80px"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
</section>
</div>

<sc-if value="{{v.toast}}" hint-placeholder-val="{{ false }}">
<div class="glass" role="status" style="position: absolute; left: 24px; right: 24px; bottom: 164px; min-height: 56px; border-radius: 20px; padding: 4px 16px; display: flex; align-items: center; gap: 10px; background: rgba(40,35,31,0.82)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ok)"><path d="M20 6 9 17l-5-5"/></svg>
<span style="font-size: 14px; font-weight: 500">{{v.toastText}}</span>
</div>
</sc-if>

<sc-if value="{{v.sheet}}" hint-placeholder-val="{{ false }}">
<div onClick="{{cancel}}" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>
<div role="dialog" aria-label="{{t.title}}" style="position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 36px; padding: 12px 24px 28px; background: rgba(34,30,27,0.86); -webkit-backdrop-filter: blur(32px) saturate(170%); backdrop-filter: blur(32px) saturate(170%); border: 1px solid var(--glEdge); box-shadow: inset 0 1px 0 var(--glHi), 0 -20px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 20px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--fg2); opacity: 0.4"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.iconBg}}; color: {{t.iconFg}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/><path d="{{t.icon2}}"/></svg></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--fg2)">{{t.step}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 24px; line-height: 30px; font-weight: 600">{{t.title}}</div>
<div style="font-size: 16px; line-height: 24px; color: var(--fg2)">{{t.body}}</div>
</div>
<sc-if value="{{v.stage1}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button class="key {{t.topCls}}" onClick="{{next}}" style="height: 56px">{{t.top}}</button>
<button class="key" onClick="{{cancel}}" style="height: 64px">Nggak jadi</button>
</div>
</sc-if>
<sc-if value="{{v.stage2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button class="key" onPointerDown="{{holdStart}}" onPointerUp="{{holdEnd}}" onPointerLeave="{{holdEnd}}" onPointerCancel="{{holdEnd}}" aria-label="{{t.hold}}, tahan" style="position: relative; height: 72px; overflow: hidden; background: var(--dangerSoft); color: var(--dangerText); border: 1.5px solid var(--dangerText); box-shadow: none">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{v.pct}}%; background: var(--danger)"></span>
<span style="position: relative; display: flex; align-items: center; gap: 10px; color: {{v.holdFg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{t.icon}}"/><path d="{{t.icon2}}"/></svg>{{t.hold}}</span>
</button>
<div style="text-align: center; font-size: 14px; line-height: 20px; font-weight: {{v.hintW}}; color: {{v.hintColor}}">{{v.hint}}</div>
<button class="key" onClick="{{cancel}}" style="height: 56px">Nggak jadi</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{v.count}}" hint-placeholder-val="{{ false }}">
<div role="alertdialog" aria-label="{{t.count}} {{v.n}} detik" style="position: absolute; inset: 0; padding: 72px 24px 36px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-sizing: border-box; background: rgba(17,15,13,0.94)">
<div style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--fg2)">LAPTOP-KAMIL</div>
<div style="font-size: 24px; line-height: 30px; font-weight: 600">{{t.count}}</div>
<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center">
<div style="width: 260px; height: 260px; border-radius: 999px; background: conic-gradient({{t.ring}} {{v.deg}}deg, var(--track) 0); display: flex; align-items: center; justify-content: center">
<div style="width: 236px; height: 236px; border-radius: 999px; background: #171412; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 120px; font-weight: 600; letter-spacing: -0.03em">{{v.n}}</div>
</div>
</div>
<div style="font-size: 15px; color: var(--fg2)">Mau berhenti? Tekan Batal kapan aja.</div>
<button class="key strong" onClick="{{cancelCount}}" style="width: 100%; height: 80px; font-size: 20px">Batal</button>
</div>
</sc-if>

<sc-if value="{{v.done}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; padding: 72px 24px 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-sizing: border-box; text-align: center; background: rgba(17,15,13,0.94)">
<div style="width: 80px; height: 80px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: var(--ok)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
<div style="font-size: 24px; line-height: 30px; font-weight: 600">{{t.doneTitle}}</div>
<div style="font-size: 16px; line-height: 24px; color: var(--fg2); max-width: 300px">{{t.doneBody}}</div>
<div style="height: 24px"></div>
<button class="key strong" onClick="{{reset}}" style="width: 100%; height: 64px">Oke (ulang demo)</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { screen: 'remote', action: 'off', pct: 0, early: false, n: 5, toast: '' };
}
componentWillUnmount() { this.clearAll(); }
clearAll() { clearInterval(this.holdT); clearInterval(this.countT); clearTimeout(this.toastT); }
startCount() {
clearInterval(this.holdT);
this.setState({ screen: 'count', n: 5, pct: 0 });
clearInterval(this.countT);
this.countT = setInterval(() => {
const n = this.state.n - 1;
if (n <= 0) { clearInterval(this.countT); this.setState({ screen: 'done', n: 0 }); }
else this.setState({ n });
}, 1000);
}
renderVals() {
const st = this.state;
const T = {
sleep: { step: 'SLEEP', title: 'Sleep-in laptop?', body: 'Laptop-Kamil bakal tidur 5 detik lagi. Masih bisa dibatalin.', top: 'Sleep-in', topCls: 'strong', icon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z', icon2: '', count: 'Laptop tidur dalam', ring: '#FF9A6A', doneTitle: 'Laptop lagi tidur', doneBody: 'Bangunin dari laptopnya langsung ya.', cancelToast: 'Nggak jadi sleep' },
restart: { step: '1 / 2', title: 'Yakin restart laptop?', body: 'Kerjaan yang belum disimpan di Laptop-Kamil bisa hilang.', top: 'Lanjut', topCls: 'dangerOutline', hold: 'Tahan buat restart', title2: 'Tahan buat restart', body2: 'Laptop nyala lagi sendiri. Masih ada 5 detik buat batal.', icon: 'M3 12a9 9 0 1 0 3-6.7L3 8', icon2: 'M3 3v5h5', count: 'Laptop restart dalam', ring: '#FF6F5E', doneTitle: 'Laptop lagi restart', doneBody: 'Nanti nyambung lagi sendiri.', cancelToast: 'Nggak jadi restart' },
off: { step: '1 / 2', title: 'Yakin matiin laptop?', body: 'Kerjaan yang belum disimpan di Laptop-Kamil bisa hilang.', top: 'Lanjut', topCls: 'dangerOutline', hold: 'Tahan buat matiin', title2: 'Tahan buat matiin', body2: 'Habis itu masih ada 5 detik buat batal.', icon: 'M12 2v10', icon2: 'M18.4 6.6a9 9 0 1 1-12.77.04', count: 'Laptop mati dalam', ring: '#FF6F5E', doneTitle: 'Laptop lagi dimatiin', doneBody: 'Laptop-Kamil udah dapet perintahnya. Sampai besok!', cancelToast: 'Nggak jadi dimatiin' }
};
const base = T[st.action];
const stage2 = st.screen === 'sheet2';
const t = Object.assign({}, base, stage2 ? { step: '2 / 2', title: base.title2, body: base.body2, iconBg: 'rgba(255,111,94,0.10)', iconFg: '#FF8A7C' } : { iconBg: 'rgba(255,255,255,0.10)', iconFg: '#F1EBE2' });
const open = (action) => () => { clearTimeout(this.toastT); this.setState({ screen: 'sheet1', action, pct: 0, early: false, toast: '' }); };
const holding = st.pct > 0;
return {
t,
v: {
sheet: st.screen === 'sheet1' || stage2, stage1: st.screen === 'sheet1', stage2,
count: st.screen === 'count', done: st.screen === 'done',
toast: !!st.toast, toastText: st.toast,
pct: Math.round(st.pct * 100), n: st.n, deg: Math.round((st.n / 5) * 360),
holdFg: st.pct > 0.55 ? '#1A0F08' : '#FF8A7C',
hint: st.early ? 'Kelepasan. Tahan sampai penuh ya.' : (holding ? 'Terus tahan…' : 'Tahan sampai penuh, sekitar 1 detik'),
hintColor: st.early ? '#F1EBE2' : '#BDB3A6', hintW: st.early ? 600 : 400
},
openSleep: open('sleep'), openRestart: open('restart'), openOff: open('off'),
cancel: () => { clearInterval(this.holdT); this.setState({ screen: 'remote', pct: 0 }); },
next: () => { if (st.action === 'sleep') this.startCount(); else this.setState({ screen: 'sheet2', pct: 0, early: false }); },
holdStart: () => {
clearInterval(this.holdT);
this.setState({ early: false, pct: 0.001 });
this.holdT = setInterval(() => {
const p = this.state.pct + 50 / 1200;
if (p >= 1) this.startCount(); else this.setState({ pct: p });
}, 50);
},
holdEnd: () => {
if (this.state.screen !== 'sheet2' || this.state.pct === 0) return;
clearInterval(this.holdT);
this.setState({ pct: 0, early: true });
},
cancelCount: () => {
clearInterval(this.countT);
this.setState({ screen: 'remote', toast: t.cancelToast });
clearTimeout(this.toastT);
this.toastT = setTimeout(() => this.setState({ toast: '' }), 2500);
},
reset: () => { this.clearAll(); this.setState({ screen: 'remote', pct: 0, toast: '', n: 5 }); }
};
}
}
</script>
</body>
</html>
