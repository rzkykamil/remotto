<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Remotto — Remote 412 gelap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#A33B0C}a:hover{color:#7E2D08}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glEdge);box-shadow:inset 0 1px 0 var(--glHi),inset 0 -1px 0 var(--glLo),0 12px 32px var(--glShadow)}
.key{appearance:none;margin:0;padding:0;font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--glEdge);box-shadow:inset 0 1px 0 var(--glHi);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform 180ms cubic-bezier(.34,1.4,.64,1),background 160ms;-webkit-tap-highlight-color:transparent}
.key.glass{background:var(--gl)}
.key:active:not(:disabled){transform:scale(.94);background:var(--chipPress);transition-duration:90ms}
.key:disabled{color:var(--dis);background:var(--chipDis);box-shadow:none;cursor:not-allowed}
.key:focus-visible{outline:3px solid var(--accText);outline-offset:3px}
.key.acc{background:linear-gradient(180deg,var(--accHi),var(--acc));color:var(--onAcc);border-color:rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 10px 28px var(--accShadow)}
.key.acc:disabled{background:var(--chipDis);color:var(--dis);box-shadow:none}
.vol{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.vol:disabled{cursor:not-allowed}
.track:focus-within{outline:3px solid var(--accText);outline-offset:3px}
.link{appearance:none;border:0;background:none;font:inherit;color:var(--accText);font-weight:600;padding:0 12px;min-height:48px;cursor:pointer}
@media (prefers-reduced-motion: reduce){.key{transition:none}.key:active:not(:disabled){transform:none}}
@media (prefers-reduced-transparency: reduce){.glass,.key{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}}
</style>
</helmet>
<div style="width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; padding: 52px {{s.m}}px 36px; display: flex; flex-direction: column; gap: 20px; font-family: Geist, system-ui, sans-serif; color: var(--fg); background-color: var(--bg); background-image: radial-gradient(90% 45% at 90% 18%, var(--glowA), transparent 70%), radial-gradient(90% 40% at 8% 92%, var(--glowB), transparent 70%); --bg: {{c.bg}}; --fg: {{c.fg}}; --fg2: {{c.fg2}}; --dis: {{c.dis}}; --gl: {{c.gl}}; --glEdge: {{c.glEdge}}; --glHi: {{c.glHi}}; --glLo: {{c.glLo}}; --glShadow: {{c.glShadow}}; --chip: {{c.chip}}; --chipPress: {{c.chipPress}}; --chipDis: {{c.chipDis}}; --solid: {{c.solid}}; --track: {{c.track}}; --acc: {{c.acc}}; --accHi: {{c.accHi}}; --accShadow: {{c.accShadow}}; --onAcc: {{c.onAcc}}; --accText: {{c.accText}}; --ok: {{c.ok}}; --warn: {{c.warn}}; --glowA: {{c.glowA}}; --glowB: {{c.glowB}}">

<header style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<div style="max-width: 100%; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Laptop-Kamil</div>
<div class="glass" role="status" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--fg2)">
<sc-if value="{{st.online}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--ok)"></span><span>NYAMBUNG · 3J 12M</span></sc-if>
<sc-if value="{{st.connecting}}" hint-placeholder-val="{{ false }}"><span style="width: 5px; height: 5px; border-radius: 999px; border: 2px solid var(--warn)"></span><span style="color: var(--warn)">MENYAMBUNG…</span></sc-if>
<sc-if value="{{st.offline}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="m2 2 20 20"/></svg><span>NGGAK KEJANGKAU</span></sc-if>
</div>
</div>
<button class="key glass" aria-label="Pengaturan" style="width: 48px; height: 48px; flex: 0 0 auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></button>
</header>

<section aria-label="Daya" style="display: flex; gap: 10px">
<button class="key glass" disabled="{{dis}}" style="flex: 1 1 0; min-width: 0; height: 52px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>Sleep</button>
<button class="key glass" disabled="{{dis}}" style="flex: 1 1 0; min-width: 0; height: 52px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
<button class="key glass" disabled="{{dis}}" style="flex: 1 1 0; min-width: 0; height: 52px; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>Matikan</button>
</section>

<section class="glass" aria-label="Volume" style="flex: 1 1 auto; min-height: 0; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--fg2)">VOLUME</span>
<sc-if value="{{v.muted}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--glEdge)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>BISU</span></sc-if>
</div>

<sc-if value="{{st.offline}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--fg2)"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.9-2"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.8"/><path d="m2 2 20 20"/></svg>
<div style="font-size: 20px; line-height: 26px; font-weight: 600">Laptop nggak kejangkau</div>
<div style="font-size: 15px; line-height: 22px; color: var(--fg2); max-width: 260px">Pastikan HP dan laptop satu WiFi, dan laptop lagi nyala.</div>
<div style="display: flex; gap: 4px; align-items: center; margin-top: 4px">
<button class="key" style="height: 48px; padding: 0 22px; font-size: 14px; font-weight: 600">Coba lagi</button>
<button class="link" style="font-size: 14px">Pairing ulang</button>
</div>
</div>
</sc-if>
<sc-if value="{{st.notOffline}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="font-family: 'Geist Mono', monospace; font-size: {{s.num}}px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: {{v.numColor}}">{{v.vol}}<span style="font-size: 0.32em; letter-spacing: 0; color: var(--fg2)">%</span></div>
<div style="font-size: 14px; line-height: 20px; color: var(--fg2)">{{v.hint}}</div>
</div>
</sc-if>

<div class="track" style="position: relative; height: 60px; border-radius: 999px; background: var(--track); box-shadow: inset 0 1px 2px var(--glLo); overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{v.vol}}%; background: {{v.fillColor}}; border-radius: 999px"></div>
<div style="position: absolute; top: 18px; bottom: 18px; left: calc({{v.vol}}% - 14px); width: 5px; border-radius: 3px; background: var(--bg); opacity: {{v.handle}}; pointer-events: none"></div>
<input class="vol" type="range" min="0" max="100" step="1" value="{{v.vol}}" onInput="{{onVol}}" disabled="{{dis}}" aria-label="Volume" aria-valuetext="{{v.vol}} persen">
</div>
<div style="display: flex; gap: 10px">
<button class="key" disabled="{{dis}}" onClick="{{toggleMute}}" aria-pressed="{{v.muted}}" style="height: 56px; padding: 0 18px; font-size: 14px; font-weight: 500; flex: 1 1 auto">
<sc-if value="{{v.muted}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>Bunyikan</sc-if>
<sc-if value="{{v.unmuted}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>Mute</sc-if>
</button>
<button class="key" disabled="{{dis}}" onClick="{{dec}}" aria-label="Volume turun 5" style="width: 72px; height: 56px; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
<button class="key" disabled="{{dis}}" onClick="{{inc}}" aria-label="Volume naik 5" style="width: 72px; height: 56px; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
</div>
</section>

<section class="glass" aria-label="Media" style="border-radius: 999px; padding: 8px; display: flex; align-items: center; justify-content: space-between">
<button class="key" disabled="{{dis}}" aria-label="Lagu sebelumnya" style="width: {{s.media}}px; height: {{s.media}}px; background: transparent; border-color: transparent; box-shadow: none"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
<button class="key acc" disabled="{{dis}}" onClick="{{togglePlay}}" aria-label="{{p.label}}" style="width: {{s.play}}px; height: {{s.play}}px">
<sc-if value="{{p.playing}}" hint-placeholder-val="{{ true }}"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg></sc-if>
<sc-if value="{{p.paused}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="margin-left: 4px"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8Z"/></svg></sc-if>
</button>
<button class="key" disabled="{{dis}}" aria-label="Lagu berikutnya" style="width: {{s.media}}px; height: {{s.media}}px; background: transparent; border-color: transparent; box-shadow: none"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"status":{"editor":"enum","options":["online","connecting","offline"],"default":"online"},"startVolume":{"editor":"range","min":0,"max":100,"step":1,"default":35},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { vol: null, muted: false, playing: true };
}
renderVals() {
const theme = this.props.theme ?? 'dark';
const big = String(this.props.width ?? '412') !== '360';
const status = this.props.status ?? 'online';
const P = {
light: { bg: '#EDE7DF', fg: '#1C1A17', fg2: '#5A534A', dis: '#9C9489', gl: 'rgba(255,255,255,0.45)', glEdge: 'rgba(255,255,255,0.75)', glHi: 'rgba(255,255,255,0.9)', glLo: 'rgba(60,40,20,0.06)', glShadow: 'rgba(80,50,20,0.10)', chip: 'rgba(255,255,255,0.55)', chipPress: 'rgba(255,255,255,0.9)', chipDis: 'rgba(255,255,255,0.22)', solid: '#F7F3EE', track: 'rgba(28,26,23,0.07)', acc: '#FF6A2B', accHi: '#FF9160', accShadow: 'rgba(255,106,43,0.35)', onAcc: '#1C1A17', accText: '#A33B0C', ok: '#246640', warn: '#7A5200', glowA: 'rgba(255,106,43,0.22)', glowB: 'rgba(255,170,90,0.30)', fill: '#1C1A17' },
dark: { bg: '#110F0D', fg: '#F1EBE2', fg2: '#BDB3A6', dis: '#6E665C', gl: 'rgba(255,255,255,0.07)', glEdge: 'rgba(255,255,255,0.14)', glHi: 'rgba(255,255,255,0.20)', glLo: 'rgba(0,0,0,0.35)', glShadow: 'rgba(0,0,0,0.45)', chip: 'rgba(255,255,255,0.08)', chipPress: 'rgba(255,255,255,0.18)', chipDis: 'rgba(255,255,255,0.03)', solid: '#221E1B', track: 'rgba(0,0,0,0.35)', acc: '#F26A30', accHi: '#FF8A55', accShadow: 'rgba(242,106,48,0.30)', onAcc: '#1A0F08', accText: '#FF9A6A', ok: '#6FCB92', warn: '#E8BE57', glowA: 'rgba(242,106,48,0.18)', glowB: 'rgba(170,80,30,0.20)', fill: '#E2D9CC' }
};
const c = P[theme] || P.light;
const s = big ? { w: 412, h: 915, m: 24, play: 96, media: 80, num: 128 } : { w: 360, h: 800, m: 20, play: 88, media: 72, num: 108 };
const vol = this.state.vol ?? (this.props.startVolume ?? 35);
const muted = this.state.muted;
const dis = status !== 'online';
const clamp = (n) => Math.max(0, Math.min(100, n));
let hint = 'Geser atau ketuk − / +';
if (status === 'connecting') hint = 'Nunggu jawaban dari laptop…';
else if (muted) hint = 'Suara laptop lagi dibisukan';
else if (vol === 0) hint = 'Paling pelan';
else if (vol === 100) hint = 'Paling kencang';
return {
c, s, dis,
st: { online: status === 'online', connecting: status === 'connecting', offline: status === 'offline', notOffline: status !== 'offline' },
v: { vol, muted, unmuted: !muted, hint, numColor: (muted || dis) ? c.fg2 : c.fg, fillColor: (muted || dis) ? c.dis : c.fill, handle: vol > 6 ? 1 : 0 },
p: { playing: this.state.playing, paused: !this.state.playing, label: this.state.playing ? 'Jeda' : 'Putar' },
onVol: (e) => this.setState({ vol: Number(e.target.value) }),
inc: () => this.setState({ vol: clamp(vol + 5) }),
dec: () => this.setState({ vol: clamp(vol - 5) }),
toggleMute: () => this.setState({ muted: !muted }),
togglePlay: () => this.setState({ playing: !this.state.playing })
};
}
}
</script>
</body>
</html>
